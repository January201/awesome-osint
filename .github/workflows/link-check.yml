name: Check Broken Links

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # Run weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install markdown-link-check
        run: npm install -g markdown-link-check
      
      - name: Check links in README.md
        run: |
          echo "Checking links in README.md..."
          markdown-link-check README.md --config .github/link-check-config.json || true
      
      - name: Check links in CONTRIBUTING.md
        run: |
          echo "Checking links in CONTRIBUTING.md..."
          markdown-link-check CONTRIBUTING.md --config .github/link-check-config.json || true
