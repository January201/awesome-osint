name: Verify Alphabetical Order

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  check-alphabetical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          pip install beautifulsoup4 markdown
      
      - name: Check alphabetical order
        run: python .github/scripts/check_alphabetical.py
