name: Spell Check

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  spell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install cspell
        run: npm install -g cspell
      
      - name: Run spell check
        run: |
          cspell README.md CONTRIBUTING.md --config .github/cspell.json || true
